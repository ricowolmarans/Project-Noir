[package]
name = "noir"
version = "0.1.0"
edition = "2021"
description = "Noir browser beta"
authors = ["Rico"]

[dependencies]
eframe = "0.29"
ureq = "2"
html5ever = "0.27"
markup5ever_rcdom = "0.3"

[profile.release]
lto = true
strip = true

[package.metadata.deb]
maintainer = "Rico"
copyright = "2026, Rico"
section = "web"
priority = "optional"
depends = "$auto"
assets = [
  ["target/release/noir", "usr/bin/", "755"],
  ["noir.desktop", "usr/share/applications/", "644"],
]